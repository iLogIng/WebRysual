<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRysual</title>
  </head>

  <body>
    <div id="app"></div>
    <button
      id="panel-toggle"
      class="panel-toggle"
      type="button"
      aria-label="播放列表"
      aria-expanded="false"
    >
      <span></span><span></span><span></span>
    </button>

    <aside id="playlist" class="playlist" aria-label="播放列表">
      <header class="playlist-header">
        <span class="playlist-title"
          >PLAYLIST-<span id="playlist-count">0</span></span
        >
      </header>

      <ul id="playlist-list" class="playlist-list"></ul>

      <footer class="playlist-footer">
        <button id="playlist-add" type="button">添加曲目</button>
      </footer>
    </aside>

    <div id="hud" class="hud"></div>
    <div id="controls" class="controls">
      <input
        id="seek"
        class="seek"
        type="range"
        min="0"
        max="1000"
        step="1"
        value="0"
        disabled
      />
      <button id="btn-prev" type="button" disabled>上一首</button>
      <button id="btn-back" type="button" disabled>-5s</button>
      <button id="btn-play" type="button" disabled>播放</button>
      <button id="btn-fwd" type="button" disabled>+5s</button>
      <button id="btn-next" type="button" disabled>下一首</button>
      <button id="btn-vol-down" type="button">音量 -</button>
      <button id="btn-vol-up" type="button">音量 +</button>

      <span id="track" class="track">未加载</span>
      <span id="time" class="time">00:00 / 00:00</span>

      <input id="file" type="file" accept="audio/*" multiple hidden />
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
